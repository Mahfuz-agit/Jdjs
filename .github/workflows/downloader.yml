name: Video Downloader

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Video URL to download'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Install yt-dlp
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install -U "yt-dlp[default,curl-cffi]"

      - name: Install deno
        run: curl -fsSL https://deno.land/install.sh | sh

      - name: Add cookies
        run: echo "${{ secrets.YT_COOKIES }}" > cookies.txt

      - name: Download video
        run: |
          mkdir -p downloads
          yt-dlp --impersonate chrome -o "downloads/%(title)s.%(ext)s" "${{ github.event.inputs.video_url }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-video
          path: downloads/
          retention-days: 3
